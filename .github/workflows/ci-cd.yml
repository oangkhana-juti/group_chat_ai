name: CI/CD

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    name: Build & smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: portfolio }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - name: Build client
        run: cd client && npm ci && npm run build
      - name: Install server
        run: cd server && npm ci
      - name: Smoke test API
        run: |
          cd server && node index.js &
          for i in $(seq 1 20); do curl -sf localhost:3001/api/health && break || sleep 1; done
          curl -sf localhost:3001/api/health
          curl -sf localhost:3001/api/portfolio | grep -q '"members"'
          curl -sf localhost:3001/api/portfolio | grep -q '"responsibilities"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3001/api/chat -H 'Content-Type: application/json' -d '{}')" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/api/nope)" = 404

  docker:
    name: Build & push Docker image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Deploy to Render
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
