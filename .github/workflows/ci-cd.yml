name: CI/CD

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    name: Build & smoke test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - name: Install and start PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb portfolio
      - name: Build client
        run: cd client && npm ci && npm run build
      - name: Install server
        run: cd server && npm ci
      - name: Smoke test API
        run: |
          cd server && node index.js &
          for i in $(seq 1 20); do curl -sf localhost:3001/api/health && break || sleep 1; done
          curl -sf localhost:3001/api/health
          curl -sf localhost:3001/api/portfolio | grep -q '"members"'
          curl -sf localhost:3001/api/portfolio | grep -q '"responsibilities"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3001/api/chat -H 'Content-Type: application/json' -d '{}')" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/api/nope)" = 404

  pages:
    name: Deploy frontend to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Require deployed API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Set the VITE_API_URL repository variable to the Render API origin."
            exit 1
          fi
      - name: Build static frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/out
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    name: Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Set the RENDER_DEPLOY_HOOK_URL repository secret."
            exit 1
          fi
          curl -sf -X POST "$RENDER_DEPLOY_HOOK_URL"
